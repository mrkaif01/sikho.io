<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile - Sikho.io</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
padding:20px;
}

.container{
max-width:450px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 2px 15px rgba(0,0,0,.1);
}

.back{
text-decoration:none;
font-size:24px;
color:black;
}

h2{
text-align:center;
margin:15px 0 25px;
}

.preview{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
display:block;
margin:0 auto 15px;
border:4px solid #eee;
}

input[type="text"]{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
box-sizing:border-box;
margin-bottom:15px;
}

input[type="file"]{
width:100%;
margin-bottom:15px;
}

.save-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#ff8c42;
color:white;
font-size:16px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<a href="profile.html" class="back">✕</a>

<h2>Edit Profile</h2>

<img id="preview"
class="preview"
src="https://via.placeholder.com/120">

<input type="file"
id="photo"
accept="image/*">

<input type="text"
id="name"
placeholder="Enter your name">

<button class="save-btn"
onclick="saveProfile()">
Save Changes
</button>

</div>

<script>

let savedName =
localStorage.getItem("username");

if(savedName){
document.getElementById("name").value =
savedName;
}

let savedPhoto =
localStorage.getItem("profilePhoto");

if(savedPhoto){
document.getElementById("preview").src =
savedPhoto;
}

document.getElementById("photo")
.addEventListener("change", function(){

let file = this.files[0];

if(file){

let reader = new FileReader();

reader.onload = function(e){

document.getElementById("preview").src =
e.target.result;

};

reader.readAsDataURL(file);

}

});

function saveProfile(){

let name =
document.getElementById("name").value;

localStorage.setItem(
"username",
name
);

let file =
document.getElementById("photo").files[0];

if(file){

let reader =
new FileReader();

reader.onload = function(e){

localStorage.setItem(
"profilePhoto",
e.target.result
);

window.location.href =
"profile.html";

};

reader.readAsDataURL(file);

}else{

window.location.href =
"profile.html";

}

}

</script>

</body>
</html>
