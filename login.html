<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sikho.io - Learn Anything, Anytime</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.card{
background:white;
width:100%;
max-width:350px;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.logo{
font-size:30px;
font-weight:bold;
color:#2563eb;
margin-bottom:10px;
}

.text{
color:#666;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">Sikho.io</div>

<p class="text">Learn Anything, Anytime</p>

<input type="text" id="name" placeholder="Enter Your Name">

<button onclick="login()">Login</button>

</div>

<script>
function login(){

let name=document.getElementById("name").value;

if(name==""){
alert("Please enter your name");
return;
}

localStorage.setItem("username",name);

window.location.href="index.html";
}
</script>

</body>
</html>
