<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Mode - Sikho.io</title>

<style>
body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:black;
transition:0.3s;
}

body.dark{
background:#121212;
color:white;
}

.back-btn{
width:45px;
height:45px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
font-size:24px;
color:black;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

body.dark .back-btn{
background:#222;
color:white;
}

h1{
text-align:center;
margin:20px 0;
}

.card{
background:white;
padding:20px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-top:20px;
}

body.dark .card{
background:#1e1e1e;
}

.switch{
position:relative;
display:inline-block;
width:50px;
height:26px;
}

.switch input{
display:none;
}

.slider{
position:absolute;
top:0;
left:0;
right:0;
bottom:0;
background:#ccc;
border-radius:30px;
}

.slider:before{
content:"";
position:absolute;
height:20px;
width:20px;
left:3px;
bottom:3px;
background:white;
border-radius:50%;
transition:.3s;
}

input:checked + .slider{
background:#ff8c42;
}

input:checked + .slider:before{
transform:translateX(24px);
}
</style>
</head>

<body>

<a href="profile.html" class="back-btn">✕</a>

<h1>🌙 Dark Mode</h1>

<div class="card">

<span>Dark Mode</span>

<label class="switch">
<input type="checkbox" id="darkToggle">
<span class="slider"></span>
</label>

</div>

<script>

let toggle =
document.getElementById("darkToggle");

if(localStorage.getItem("darkmode")=="on"){
document.body.classList.add("dark");
toggle.checked=true;
}

toggle.addEventListener("change",function(){

if(this.checked){

document.body.classList.add("dark");
localStorage.setItem("darkmode","on");

}else{

document.body.classList.remove("dark");
localStorage.setItem("darkmode","off");

}

});

</script>

</body>
</html>
