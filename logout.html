<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logout - Sikho.io</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f5f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.back-btn{
position:absolute;
top:20px;
left:20px;
width:45px;
height:45px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
font-size:24px;
color:black;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.card{
background:white;
padding:30px;
border-radius:20px;
text-align:center;
width:320px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.icon{
font-size:60px;
margin-bottom:10px;
}

h2{
margin:10px 0;
}

p{
color:#666;
margin-bottom:25px;
}

.logout-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#ff8c42;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<a href="profile.html" class="back-btn">✕</a>

<div class="card">

<div class="icon">🚪</div>

<h2>Logout</h2>

<p>Are you sure you want to logout?</p>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

<script>

function logout(){

localStorage.removeItem("username");

window.location.href="login.html";

}

</script>

</body>
</html>
