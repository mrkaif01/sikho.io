<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - Sikho.io</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f5f7fb;
}

.back-btn{
width:45px;
height:45px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
font-size:24px;
color:black;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin:20px 0;
}

.card{
background:white;
padding:20px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
margin-top:20px;
}

.switch{
position:relative;
display:inline-block;
width:50px;
height:26px;
}

.switch input{
display:none;
}

.slider{
position:absolute;
cursor:pointer;
top:0;
left:0;
right:0;
bottom:0;
background:#ccc;
border-radius:30px;
transition:.3s;
}

.slider:before{
content:"";
position:absolute;
height:20px;
width:20px;
left:3px;
bottom:3px;
background:white;
border-radius:50%;
transition:.3s;
}

input:checked + .slider{
background:#ff8c42;
}

input:checked + .slider:before{
transform:translateX(24px);
}

</style>
</head>

<body>

<a href="profile.html" class="back-btn">✕</a>

<h1>🔔 Notifications</h1>

<div class="card">

<span>Notifications</span>

<label class="switch">
<input type="checkbox" id="notify">
<span class="slider"></span>
</label>

</div>

<script>

let notify =
document.getElementById("notify");

if(localStorage.getItem("notifications")=="on"){
notify.checked=true;
}

notify.addEventListener("change",function(){

localStorage.setItem(
"notifications",
this.checked ? "on" : "off"
);

});

</script>

</body>
</html>
