<style>

    padding:0;
    box-sizing:border-box;
}

body{

    background:#0f1115;
    color:white;
}

.header{
    padding:20px;

.video-card h2{

    padding:14px;

}

.back{
    display:inline-block;
    margin:20px;
    color:#00d4ff;
    text-decoration:none;
    font-size:16px;
}

.bottom{
    margin-top:20px;
    padding:18px;
    display:flex;
    justify-content:space-around;
    background:#171a21;
    border-top:1px solid #292d36;
}

.bottom a{
    color:#aaa;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>
