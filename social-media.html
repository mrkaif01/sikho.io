<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Media - Sikho.io</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7fb;
    color:#222;
}

.header{
    padding:20px;
    text-align:center;
    background:white;
    border-bottom:1px solid #e5e5e5;
}

.header h1{
    font-size:25px;
}

.header p{
    margin-top:7px;
    color:#777;
    font-size:14px;
}

.back{
    display:inline-block;
    margin:20px;
    color:#333;
    text-decoration:none;
    font-size:16px;
}

.container{
    padding:0 20px 20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.video-card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #e5e5e5;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.thumbnail{
    width:100%;
    height:140px;
    background:#eef1f6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

.video-card h2{
    font-size:17px;
    padding:14px;
    line-height:1.4;
}

.bottom{
    margin-top:20px;
    padding:18px;
    display:flex;
    justify-content:space-around;
    background:white;
    border-top:1px solid #e5e5e5;
}

.bottom a{
    color:#555;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<div class="header">
    <h1>📸 Social Media</h1>
    <p>Learn Social Media Step by Step</p>
</div>

<a href="index.html" class="back">❮ Back</a>

<div class="container">

    <div class="video-card">
        <div class="thumbnail">📱</div>
        <h2>Social Media Basics</h2>
    </div>

    <div class="video-card">
        <div class="thumbnail">📸</div>
        <h2>Instagram Basics</h2>
    </div>

    <div class="video-card">
        <div class="thumbnail">🎥</div>
        <h2>Instagram Reels</h2>
    </div>

    <div class="video-card">
        <div class="thumbnail">▶️</div>
        <h2>YouTube Shorts</h2>
    </div>

    <div class="video-card">
        <div class="thumbnail">💬</div>
        <h2>Posts and Captions</h2>
    </div>

    <div class="video-card">
        <div class="thumbnail">🔒</div>
        <h2>Privacy and Account Security</h2>
    </div>

</div>

<div class="bottom">
    <a href="index.html">🏠 Home</a>
    <a href="courses.html">📚 Courses</a>
    <a href="profile.html">👤 Profile</a>
</div>

</body>
</html>
