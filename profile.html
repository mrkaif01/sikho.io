<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Sikho.io</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
}

.header{
padding:20px;
font-size:24px;
font-weight:bold;
}

.profile-card{
text-align:center;
padding:20px;
}

.profile-img{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:4px solid #fff;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.name{
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.edit-btn{
display:inline-block;
margin-top:15px;
background:#ff8c42;
color:white;
padding:12px 25px;
border-radius:25px;
text-decoration:none;
font-weight:bold;
}

.menu{
margin:20px;
}

.item{
background:white;
padding:18px;
margin-bottom:12px;
border-radius:15px;
text-decoration:none;
color:black;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:12px 0;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.bottom-nav a{
text-decoration:none;
color:#2196f3;
font-weight:bold;
text-align:center;
}
</style>
</head>

<body>

<div class="header">👤 Profile</div>

<div class="profile-card">

<img id="profileImg"
class="profile-img"
src="https://via.placeholder.com/100">

<div class="name" id="user">Kaif</div>

<a href="edit-profile.html" class="edit-btn">
✏️ Edit Profile
</a>

</div>

<div class="menu">

<a href="language.html" class="item">
<span>🌐 Language</span>
<span>›</span>
</a>

<a href="notifications.html" class="item">
<span>🔔 Notifications</span>
<span>›</span>
</a>

<a href="darkmode.html" class="item">
<span>🌙 Dark Mode</span>
<span>›</span>
</a>

<a href="about.html" class="item">
<span>ℹ️ About Sikho.io</span>
<span>›</span>
</a>

<a href="logout.html" class="item">
<span>🚪 Logout</span>
<span>›</span>
</a>

</div>

<div class="bottom-nav">
<a href="index.html">🏠<br>Home</a>
<a href="courses.html">📚<br>Courses</a>
<a href="profile.html">👤<br>Profile</a>
</div>

<script>
let user = localStorage.getItem("username");
if(user){
document.getElementById("user").innerText = user;
}

let photo = localStorage.getItem("profilePhoto");
if(photo){
document.getElementById("profileImg").src = photo;
}
</script>

</body>
</html>
